services:
  - type: web
    name: thinknote-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: NODE_ENV
        value: production
      - key: AI_PROVIDER
        value: auto
      - key: SEARCH_PROVIDER
        value: none
      - key: OPENAI_MODEL
        value: gpt-5.1
      - key: OPENAI_FALLBACK_MODELS
        value: gpt-5-mini,gpt-4.1-mini
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: AUTO_ENRICH_ON_CREATE
        value: "false"
      - key: AUTO_ENRICH_DELAY_HOURS
        value: "24"
      - key: JOB_POLL_INTERVAL_MS
        value: "500"
      - key: JOB_MAX_RETRIES
        value: "3"
      - key: SEED_DEFAULT_NOTES
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
